[package]
name = "tg-router"
version = "0.1.0"
edition = "2021"
description = "Rust port of the Telegram router: single Bot API poller + per-route MCP servers behind tg-bridge"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "process", "sync", "macros", "fs", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
serde_json = "1"
fancy-regex = "0.13"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
